# =============================================================
# Tomato Sorter v2.0 — Master Configuration
# =============================================================
# All tunable values live here. NO hardcoded values in code.

# --- Camera ---------------------------------------------------
camera:
  device: 1            # /dev/video1 — kernel sometimes shuffles indices
  width: 640
  height: 480
  backend: V4L2

# --- YOLO11n NCNN model ---------------------------------------
detector:
  model_param: "models/best.ncnn.param"
  model_bin:   "models/best.ncnn.bin"
  input_size: 480
  conf_threshold: 0.25
  iou_threshold:  0.45
  classes:
    - ripe       # 0 -> Bin 1, sort LEFT
    - rotten     # 1 -> Bin 3, sort RIGHT
    - unripe     # 2 -> Bin 2, sort CENTER

# --- Sensors (DHT22 on Pi GPIO) -------------------------------
sensors:
  ripe:
    gpio_pin: 4         # GPIO 4 (physical pin 7)
    label: "Ripe Bin"
  unripe:
    gpio_pin: 23        # GPIO 23 (physical pin 16)
    label: "Unripe Bin"
  poll_interval_seconds: 2
  cache_timeout_seconds: 30

# --- Arduino serial -------------------------------------------
arduino:
  port: "/dev/ttyUSB0"
  baud: 9600
  timeout: 1.0

# --- Conveyor (BTS7960 via Pi GPIO) ---------------------------
conveyor:
  rpwm_gpio_pin: 18    # physical pin 12
  lpwm_gpio_pin: 19    # physical pin 35

# --- Sort cycle timing (milliseconds) -------------------------
cycle:
  gate_open_hold_ms:    300    # legacy: Servo 1 is disabled, kept only for backward compatibility
  min_travel_ms:        1500   # ignore early IR triggers after each cycle starts
  ir_sort_delay_ms:     0      # delay after accepted IR trigger before moving Servo 2/3
  ir_sort_cooldown_ms:  2500   # ignore repeat IR triggers after a sort
  require_detection:    true   # IR alone will not sort; camera must see a tomato
  conveyor_travel_ms:   6000   # max time tomato can be on conveyor before timeout
  sort_settle_ms:       1500   # hold sort flap deflected so tomato falls into bin, then return to both-OPEN rest
  rest_between_ms:      300    # idle between cycles
  fallback_class: "unripe"     # if no detection by IR trigger, default to this

# --- Database -------------------------------------------------
database:
  path: "data/sorter.db"

# --- Web server -----------------------------------------------
server:
  host: "0.0.0.0"
  port: 5000
  debug: false

# --- Logging --------------------------------------------------
logging:
  level: "INFO"
  file: "data/logs/sorter.log"
  max_bytes: 10485760
  backup_count: 5
